<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nikah Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{--cream:#f5ece0;--sand:#e6d1b7;--rose:#c0806f;--brown:#5a3d2f;--gold:#b98a3e;--blush:#e6c4b4}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#e6d1b7;color:var(--brown);font-family:'Cormorant Garamond',serif;font-size:clamp(17px,4.6vw,19px);-webkit-text-size-adjust:100%;line-height:1.7;text-align:center;overflow-x:hidden}
body.locked{overflow:hidden;height:100vh;height:100dvh}
body::before{content:"";position:fixed;inset:-30px;z-index:-1;background:#e6d1b7 url(img/hero.jpg) center/cover;filter:blur(22px) brightness(.97)}
#app{max-width:520px;margin:0 auto;background:var(--cream);min-height:100vh;box-shadow:0 0 70px rgba(60,40,20,.4);overflow:hidden}
img{max-width:100%}
a.btn:hover{background:rgba(185,138,62,.15)}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.script{font-family:'Great Vibes',cursive;font-weight:400;line-height:1.2}
.label{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--rose)}
.names{color:var(--rose)}
section{padding:56px clamp(16px,5vw,28px);position:relative}
section.alt{background:var(--sand)}
.wrap{max-width:460px;margin:0 auto}
h2{font-size:clamp(34px,9vw,46px);margin:6px 0 8px}
.rule{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px auto 26px;width:150px}
.rule::before,.rule::after{content:"";flex:1;height:1px;background:var(--gold)}
.rule i{width:6px;height:6px;background:var(--gold);transform:rotate(45deg)}
.garland{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.btn{display:inline-block;margin-top:14px;padding:11px 22px;border:1px solid var(--gold);color:var(--brown);font:500 11px 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;text-decoration:none}
.rv{opacity:0;transform:translateY(18px);transition:opacity .9s,transform .9s}
.rv.on{opacity:1;transform:none}

/* Cover */
#cover{position:fixed;top:0;bottom:0;left:50%;width:min(100%,520px);transform:translateX(-50%);z-index:50;background:#f3e6d0 url(img/cover.jpg) center/cover no-repeat;transition:opacity 1.8s ease,transform 2.4s ease}
#cover.open{opacity:0;transform:translateX(-50%) scale(1.18);pointer-events:none}
#cover .tap{position:absolute;top:63%;left:55%;transform:translate(-50%,-50%);z-index:2;font-size:30px;cursor:pointer;background:none;border:0;color:#6b4a2f;font-family:inherit;padding:20px 30px;white-space:nowrap}
#cover .glow{position:absolute;left:22%;top:35%;width:260px;height:260px;border-radius:50%;background:radial-gradient(#fff8d8,transparent 70%);opacity:0;transition:opacity 1.2s;z-index:1}
#cover.open .glow{opacity:1}
#cover.gone{display:none}

/* Hero */
#hero{min-height:100vh;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:70px 0 60px;background:#f3e6d0 url(img/hero.jpg) center/cover no-repeat}
.frame{position:relative;width:100%;max-width:420px;padding:30px 13% 20px}
.bism{font-size:clamp(24px,8vw,34px);color:var(--brown);line-height:1.2;margin-bottom:12px}
.small{font:500 10.5px/1.8 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;margin-top:6px}
.names{font-size:clamp(30px,8.6vw,43px);word-spacing:.13em}
.amp{font-size:28px;color:var(--gold)}
.sub{font-style:italic;font-size:17px}
.scroll{margin-top:26px;font:500 10px 'DM Sans',sans-serif;letter-spacing:.25em}
.scroll::after{content:"";display:block;width:1px;height:36px;background:var(--gold);margin:8px auto 0}

/* Scratch */
.scratch{position:relative;width:100%;max-width:340px;aspect-ratio:972/660;margin:0 auto}
.scratch .in,.scratch canvas{position:absolute;left:12.4%;top:25%;width:75.1%;height:56.8%}
.scratch .in{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fbf4e8}
.scratch .d{font-size:clamp(22px,6.5vw,30px);line-height:1.2}
.scratch canvas{touch-action:none;transition:opacity 1s}
.scratch canvas.done{opacity:0;pointer-events:none}
.scratch .fr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Carousel */
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:0;scrollbar-width:none;box-shadow:0 12px 30px rgba(90,61,47,.25)}
.car::-webkit-scrollbar{display:none}
.car div{flex:0 0 100%;scroll-snap-align:center;aspect-ratio:4/5;background:linear-gradient(160deg,var(--blush),var(--sand)) center/cover}
.dots{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dots b{width:7px;height:7px;border-radius:50%;border:1px solid var(--brown)}
.dots b.on{background:var(--brown)}

/* Countdown */
.cd{display:flex;justify-content:center;gap:clamp(10px,4vw,22px)}
.cd span{font-size:clamp(30px,9vw,42px);line-height:1.1;display:block}
.cd small{font:400 10px 'DM Sans',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--rose)}

/* Timeline */
.tl{position:relative;text-align:left;padding-left:0;margin:0 auto;max-width:340px}
.tl::before{content:"";position:absolute;left:88px;top:8px;bottom:8px;width:1px;background:var(--gold)}
.tl li{list-style:none;display:flex;gap:30px;margin-bottom:22px;position:relative}
.tl li::before{content:"";position:absolute;left:84px;top:10px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.tl .t{width:70px;font:500 11px 'DM Sans',sans-serif;letter-spacing:.14em;color:var(--rose);padding-top:4px;text-align:right}
.tl b{font-weight:400;font-size:23px;display:block;line-height:1.2}
.tl em{font-size:15px;opacity:.75}

/* Venue + cards */
.venue{background:var(--brown);color:var(--cream);padding:46px 24px;max-width:340px;margin:0 auto;outline:1px solid var(--gold);outline-offset:-10px}
.venue .label{color:var(--sand)}
.venue .btn{color:var(--cream)}
.card{border:1px solid var(--gold);padding:8px;margin:0 auto 18px;max-width:340px;background:rgba(232,211,176,.35)}
.card>div{border:1px solid rgba(185,138,62,.5);padding:26px 14px}
.card h3{font-weight:400;font-size:30px;line-height:1.2}
.card p{font-style:italic;font-size:17px}

/* Dress code */
.sw{display:flex;justify-content:center;margin-top:22px}
.sw i{width:50px;height:50px;border-radius:50%;margin:0 -4px;border:3px solid #f3e4d2;box-shadow:0 4px 10px rgba(90,61,47,.2)}

/* Closing */
.arch{max-width:330px;margin:26px auto 0;border:1px solid var(--gold);border-radius:165px 165px 0 0;padding:70px 20px 50px}
#hint{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:50%;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:rgba(245,236,224,.92);box-shadow:0 2px 10px rgba(90,61,47,.25);z-index:45;opacity:0;pointer-events:none;transition:opacity .6s;animation:nudge 1.8s ease-in-out infinite}
#hint::after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-7px 0 0 -4.5px;border-right:2px solid var(--brown);border-bottom:2px solid var(--brown);transform:rotate(45deg)}
#hint.show{opacity:1}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:0 6px}}
@media (prefers-reduced-motion:reduce){#hint{animation:none}}
/* Music + petals */
#mus{position:fixed;top:max(12px,env(safe-area-inset-top));right:max(12px,calc(50% - 260px + 12px));z-index:60;width:38px;height:38px;border-radius:50%;border:0;background:rgba(90,61,47,.6);color:#fff;font-size:15px;cursor:pointer;display:none}
.petal{position:fixed;top:-20px;z-index:40;width:10px;height:13px;border-radius:70% 0 70% 0;background:var(--blush);opacity:.8;pointer-events:none;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.petal{display:none}.rv{transition:none;opacity:1;transform:none}.curtain{transition-duration:.01s}}
.credit{padding:20px 16px 26px;font:400 9.5px/1.8 'DM Sans',sans-serif;letter-spacing:.16em;text-transform:uppercase;color:var(--brown);opacity:.75}
.credit b{font:400 20px 'Great Vibes',cursive;letter-spacing:.02em;text-transform:none;color:var(--rose)}
.credit span{opacity:.8;font-size:8.5px}
</style>
</head>
<body class="locked">

<div id="cover">
    <div class="glow"></div>
  <button class="tap script" id="tap">tap to open</button>
</div>
<button id="mus" aria-label="Toggle music">♪</button>
<div id="hint" aria-hidden="true"></div>
<main id="app"></main>

<script>
/* ========= EDIT YOUR DETAILS HERE ========= */
const CONFIG = {
  groom:  {name:'Mohammad Maruf',       father:'Mohammad Arif',  short:'Maruf'},
  bride:  {name:'Firdos Begum', father:'Mohammad Raees', short:'Firdos'},
  eventTitle: 'the Nikah of',
  dateISO: '2027-03-28T17:00:00',          // countdown target (local time)
  dateText: 'March 28, 2027',
  dayTime:  'Sunday • 07:00 PM',
  intro: 'With hearts full of gratitude, we warmly invite you to join us as we celebrate this beautiful beginning with the love, prayers, and blessings of our families.',
  photos: ['img/photo1.jpg'],  // add more: ['img/photo1.jpg','img/photo2.jpg', ...] (files go in /img)
  music: '',   // e.g. 'audio/song.mp3'  (leave '' for no music)
  timeline: [
    ['5:00 PM','Nikah Ceremony','Solemnization & duas'],
    ['7:00 PM','Dinner','A feast shared with love']
  ],
  venue: {name:'Delux Function Hall', city:'Deglour Naka Nanded, Maharashtra', map:'https://maps.app.goo.gl/L267FS7ans44awsRA'},
  events: [
    {name:'Walima',        when:'March 29 • 7:00 PM', place:"MK Banquet Hall,Gani colony, Nanded", map:'https://maps.app.goo.gl/KX8ngaET73iKvmj59'}
  ],
  dress: 'Traditional or formal attire is encouraged. Sarees, lehengas, anarkalis, sherwanis, kurtas, suits, and formal dresses are all welcome. We kindly ask guests to avoid overly casual attire.',
  swatches: ['#5a3d2f','#e0bfae','#c0806f','#b98a3e','#f6ecdd'],
  closing: {line1:'Your presence is our present', line2:'Your love, blessings, and presence are the greatest gifts we could ever ask for.', line3:'We can\u2019t wait to celebrate with you.'}
};
/* ========================================== */

const C = CONFIG, $ = (s,r=document)=>r.querySelector(s);

// Floral garland divider (pure SVG, no image files needed)
function garland(){ return '<img class="garland" src="img/garland.png" alt="" loading="lazy">'; }
const rule='<div class="rule"><i></i></div>';
const sec=(cls,label,title,body)=>`<section class="${cls}"><div class="wrap rv"><div class="label">${label}</div><h2 class="script">${title}</h2>${rule}${body}</div></section>`;

const photos = C.photos.length?C.photos:[0,1,2].map(()=>null);
const html = `
<section id="hero"><div class="frame rv">
  <div class="bism script">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
  <div class="names script">${C.groom.name}</div>
  <div class="small">Son of</div><div class="sub">${C.groom.father}</div>
  <div class="amp script">&amp;</div>
  <div class="names script">${C.bride.name}</div>
  <div class="small">Daughter of</div><div class="sub">${C.bride.father}</div>
  <div class="small">As they begin their forever in faith and love.</div>
  <div class="scroll">SCROLL</div>
</div></section>
${garland(3)}
<section><div class="wrap rv">
  <h2 class="script">A Blessed Beginning</h2>
  <p>${C.intro}</p>
  <div class="names script" style="font-size:38px;margin-top:12px">${C.groom.short} <span class="amp">&amp;</span> ${C.bride.short}</div>
</div></section>
${garland(5)}
${sec('alt','A date to hold close','Scratch to Reveal',`<div class="scratch"><div class="in"><div class="label">You’re invited!</div><div class="d">${C.dateText}</div><div style="font:500 13px 'DM Sans'">${C.dayTime}</div></div><canvas id="sc"></canvas><img class="fr" src="img/frame.png" alt=""></div>`)}
${garland(7)}
${sec('','Our story','Moments, softly held',`<div class="car" id="car">${photos.map(p=>`<div style="${p?`background-image:url('${p}')`:''}"></div>`).join('')}</div><div class="dots" id="dots">${photos.map(()=>'<b></b>').join('')}</div>`)}
${garland(9)}
${sec('alt','Until we say Qubool Hai','Counting every heartbeat','<div class="cd" id="cd"></div>')}
${garland(11)}
${sec('','The celebration','Our Nikah day',`<ul class="tl">${C.timeline.map(t=>`<li><span class="t">${t[0]}</span><div><b>${t[1]}</b>${t[2]?`<em>${t[2]}</em>`:''}</div></li>`).join('')}</ul>`)}
<section><div class="venue rv"><div class="label">The venue</div><h2 class="script">${C.venue.name}</h2><p>${C.venue.city}</p><a class="btn" href="${C.venue.map}" target="_blank" rel="noopener">View on Google Maps</a></div></section>
${garland(13)}
${sec('','The festivities','Days filled with joy',C.events.map(e=>`<div class="card"><div><h3>${e.name}</h3><div class="label" style="margin:4px 0">${e.when}</div><p>${e.place}</p><a class="btn" href="${e.map}" target="_blank" rel="noopener">View on Google Maps</a></div></div>`).join(''))}
${sec('alt','Dress code','Festive Formal',`<p>${C.dress}</p><div class="sw">${C.swatches.map(c=>`<i style="background:${c}"></i>`).join('')}</div>`)}
${garland(15)}
<section><div class="wrap rv">
  <div class="label">With all our hearts</div><h2 class="script">${C.closing.line1}</h2><p style="font-style:italic">${C.closing.line2}</p>
  <div class="arch"><div class="rule"><i></i></div><h2 class="script">${C.closing.line3}</h2><div class="names script" style="font-size:36px">${C.groom.short} <span class="amp">&amp;</span> ${C.bride.short}</div><div class="label" style="color:var(--gold);margin-top:10px">${C.dateText}</div></div>
</div></section> <footer class="credit">Designed &amp; Developed by<br><b>Mohammad Ikram</b><br><span>DevOps Engineer &bull; Brother of the Groom</span></footer>`;
$('#app').innerHTML = html;

// Scroll reveal
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('on')),{threshold:.15});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));

// Countdown
const target=new Date(C.dateISO).getTime();
function tick(){
  let d=Math.max(0,target-Date.now())/1000;
  const v=[['Days',d/86400],['Hours',d%86400/3600],['Minutes',d%3600/60],['Seconds',d%60]];
  $('#cd').innerHTML=v.map(([l,n])=>`<div><span>${String(Math.floor(n)).padStart(2,'0')}</span><small>${l}</small></div>`).join('');
}
tick(); setInterval(tick,1000);

// Carousel dots
const car=$('#car'), dots=[...document.querySelectorAll('#dots b')];
function dot(){const i=Math.round(car.scrollLeft/car.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',j===i))}
car.addEventListener('scroll',dot); dot();

// Scratch card
(function(){
  const cv=$('#sc'), ctx=cv.getContext('2d'); let drawing=false, cleared=false;
  function paint(){
    const r=cv.getBoundingClientRect(); cv.width=r.width; cv.height=r.height;
    const g=ctx.createLinearGradient(0,0,r.width,r.height);
    g.addColorStop(0,'#e7b9a8');g.addColorStop(.5,'#f3d6c6');g.addColorStop(1,'#d9a18f');
    ctx.fillStyle=g;ctx.fillRect(0,0,r.width,r.height);
    for(let i=0;i<160;i++){ctx.fillStyle=`rgba(255,255,255,${Math.random()*.6})`;ctx.fillRect(Math.random()*r.width,Math.random()*r.height,2,2)}
    ctx.fillStyle='#5a3d2f';ctx.font="italic 20px 'Cormorant Garamond'";ctx.textAlign='center';ctx.fillText('scratch here',r.width/2,r.height/2+6);
  }
  function scratch(e){
    if(!drawing||cleared)return; const r=cv.getBoundingClientRect();
    ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(e.clientX-r.left,e.clientY-r.top,22,0,7);ctx.fill();
  }
  function check(){
    const d=ctx.getImageData(0,0,cv.width,cv.height).data; let n=0,t=0;
    for(let i=3;i<d.length;i+=64){t++;if(d[i]<20)n++}
    if(n/t>.45){cleared=true;cv.classList.add('done');confetti();burst()}
  }
  cv.addEventListener('pointerdown',e=>{drawing=true;cv.setPointerCapture(e.pointerId);scratch(e)});
  cv.addEventListener('pointermove',scratch);
  cv.addEventListener('pointerup',()=>{drawing=false;check()});
  document.fonts.ready.then(paint);
})();
// Confetti pop
function confetti(){
  if (matchMedia('(prefers-reduced-motion:reduce)').matches) return;
  const b = $('.scratch').getBoundingClientRect();
  const cx = b.left + b.width/2, cy = b.top + b.height/2;
  const cols = ['#b98a3e','#c0806f','#e6c4b4','#f3d6c6','#d9a18f','#fff3d6'];
  for (let i = 0; i < 90; i++){
    const p = document.createElement('i'), w = 6 + Math.random()*6;
    p.style.cssText = `position:fixed;left:${cx}px;top:${cy}px;width:${w}px;height:${w*1.6}px;background:${cols[i%cols.length]};z-index:70;pointer-events:none;border-radius:${Math.random()<.3?'50%':'1px'}`;
    document.body.appendChild(p);
    const a = Math.random()*Math.PI*2, d = 120 + Math.random()*220;
    const x = Math.cos(a)*d, y = Math.sin(a)*d - 80;
    p.animate([
      {transform:'translate(0,0) rotate(0deg)', opacity:1},
      {transform:`translate(${x}px,${y}px) rotate(${Math.random()*360}deg)`, opacity:1, offset:.35},
      {transform:`translate(${x*1.2}px,${y + innerHeight*.6}px) rotate(${Math.random()*900}deg)`, opacity:0}
    ], {duration: 2200 + Math.random()*1500, easing:'cubic-bezier(.2,.7,.4,1)'}).onfinish = () => p.remove();
  }
  if (navigator.vibrate) navigator.vibrate(60);
}
// Petals
let petalsOn=false;
function burst(){
  if(petalsOn)return; petalsOn=true;
  for(let i=0;i<16;i++){
    const p=document.createElement('div');p.className='petal';
    const col=$('#app').getBoundingClientRect();p.style.left=(col.left+Math.random()*(col.width-12))+'px';p.style.animationDuration=7+Math.random()*7+'s';p.style.animationDelay=Math.random()*6+'s';
    p.style.transform=`scale(${.6+Math.random()*.8})`;document.body.appendChild(p);
  }
}
// Scroll hint
const hint=$('#hint');
addEventListener('scroll',()=>hint.classList.toggle('show',scrollY<60&&!document.body.classList.contains('locked')),{passive:true});
// Cover + music
const audio=C.music?new Audio(C.music):null, mus=$('#mus');
if(audio){audio.loop=true;mus.style.display='block'}
$('#tap').addEventListener('click',()=>{
  $('#cover').classList.add('open');
  if(audio)audio.play().catch(()=>{});
  setTimeout(()=>{$('#cover').classList.add('gone');document.body.classList.remove('locked');hint.classList.add('show');burst()},2300);
});
mus.addEventListener('click',()=>{audio.paused?audio.play():audio.pause()});
</script>
</body>
</html>
